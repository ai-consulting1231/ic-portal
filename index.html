<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会議室予約システム</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, button { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>会議室予約</h1>
    
    <div class="form-group">
        <label for="room">会議室を選択：</label>
        <select id="room">
            <option>会議室A</option>
            <option>会議室B</option>
            <option>会議室C</option>
        </select>
    </div>

    <div class="form-group">
        <label for="name">お名前：</label>
        <input type="text" id="name" placeholder="山田 太郎">
    </div>

    <div class="form-group">
        <label for="date">利用日時：</label>
        <input type="datetime-local" id="date">
    </div>

    <button type="button" onclick="alert('予約が完了しました（※テスト表示です）')">予約する</button>
</body>
</html>
