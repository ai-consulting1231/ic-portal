<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会議室予約システム</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, button { width: 100%; padding: 10px; box-sizing: border-box; font-size: 16px; }
        button.submit-btn { background-color: #007bff; color: white; border: none; cursor: pointer; margin-top: 10px; border-radius: 5px; }
        button.delete-btn { background-color: #dc3545; color: white; border: none; padding: 5px 10px; width: auto; font-size: 14px; cursor: pointer; border-radius: 3px; }
        ul { list-style: none; padding: 0; }
        li { background: #f8f9fa; border: 1px solid #ddd; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>会議室予約</h1>

    <form id="reservation-form">
        <div class="form-group">
            <label for="name">お名前：</label>
            <input type="text" id="name" placeholder="山田 太郎" required>
        </div>

        <div class="form-group">
            <label for="date">利用日時：</label>
            <input type="datetime-local" id="date" required>
        </div>

        <button type="submit" class="submit-btn">予約する</button>
    </form>

    <h2 style="margin-top: 30px;">予約一覧</h2>
    <ul id="reservation-list"></ul>

    <script>
        const form = document.getElementById('reservation-form');
        const list = document.getElementById('reservation-list');

        let reservations = JSON.parse(localStorage.getItem('reservations')) || [];

        function renderReservations() {
            list.innerHTML = '';
            reservations.forEach((item, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div>
                        <strong>${item.name}</strong><br>
                        <small>${item.date.replace('T', ' ')}</small>
                    </div>
                    <button class="delete-btn" onclick="deleteReservation(${index})">削除</button>
                `;
                list.appendChild(li);
            });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const date = document.getElementById('date').value;

            reservations.push({ name, date });
            localStorage.setItem('reservations', JSON.stringify(reservations));
            
            form.reset();
            renderReservations();
        });

        function deleteReservation(index) {
            if (confirm('この予約を削除しますか？')) {
                reservations.splice(index, 1);
                localStorage.setItem('reservations', JSON.stringify(reservations));
                renderReservations();
            }
        }

        renderReservations();
    </script>
</body>
</html>
